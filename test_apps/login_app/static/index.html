<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login Demo</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="login-card" class="login-card">
    <h1>Sign in</h1>
    <form id="login-form">
      <input id="username" class="field" type="text" placeholder="Username">
      <input id="password" class="field" type="password" placeholder="Password">
      <button id="login-btn" class="btn primary" type="submit">Login</button>
    </form>
    <p id="message" class="message"></p>
    <button id="profile-btn" class="btn" type="button">Load profile</button>
  </div>
  <script src="/static/login.js"></script>
</body>
</html>
